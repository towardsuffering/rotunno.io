[build]
  command = "pnpm run build"
  publish = "dist"

[[redirects]]
  from   = "http://rotunno.io/*"
  to     = "https://rotunno.ai/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://rotunno.io/*"
  to     = "https://rotunno.ai/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.rotunno.io/*"
  to     = "https://rotunno.ai/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.rotunno.io/*"
  to     = "https://rotunno.ai/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://rotunno.ai/*"
  to     = "https://rotunno.ai/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.rotunno.ai/*"
  to     = "https://rotunno.ai/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.rotunno.ai/*"
  to     = "https://rotunno.ai/:splat"
  status = 301
  force  = true


# project pages renamed from template slugs
[[redirects]]
  from   = "/projects/smart-home-dashboard/*"
  to     = "/projects/financial-market-data-platform/"
  status = 301

[[redirects]]
  from   = "/projects/smart-home-dashboard"
  to     = "/projects/financial-market-data-platform/"
  status = 301

[[redirects]]
  from   = "/projects/e-commerce-dashboard/*"
  to     = "/projects/custom-api-ingestion-pipeline/"
  status = 301

[[redirects]]
  from   = "/projects/e-commerce-dashboard"
  to     = "/projects/custom-api-ingestion-pipeline/"
  status = 301

[[redirects]]
  from   = "/projects/ai-content-platform/*"
  to     = "/projects/python-sql-orm-data-pipeline/"
  status = 301

[[redirects]]
  from   = "/projects/ai-content-platform"
  to     = "/projects/python-sql-orm-data-pipeline/"
  status = 301

[[redirects]]
  from   = "/projects/blockchain-marketplace/*"
  to     = "/projects/analytics-community-program/"
  status = 301

[[redirects]]
  from   = "/projects/blockchain-marketplace"
  to     = "/projects/analytics-community-program/"
  status = 301

[[redirects]]
  from   = "/projects/mobile-fitness-app/*"
  to     = "/projects/marketing-attribution-pipeline/"
