<!doctype html>
<!-- Facebook profile picture (1080x1080, shown as a circle), matching the cover and share image.
     The headshot sits inside a thin band of the site's night sky, ringed in the green-to-sky glow,
     with the home-base star on the ring. Expects chris.jpg (src/assets/images/chris.jpg) next to this file.
     Render at 2x and downsample to 1080x1080 (Lanczos), PNG. -->
<html><head><meta charset="utf-8" />
<style>
  html,body{margin:0;padding:0}
  body{width:1080px;height:1080px;overflow:hidden;background:#02060e}
  #stage{position:relative;width:100%;height:100%;
    background:
      radial-gradient(ellipse 40% 34% at 10% 92%, rgba(139,92,246,.3), transparent 70%),
      radial-gradient(ellipse 38% 30% at 92% 8%, rgba(56,189,248,.22), transparent 70%),
      radial-gradient(ellipse 30% 30% at 90% 90%, rgba(52,211,153,.18), transparent 70%),
      radial-gradient(ellipse at 50% 0%, #0c1f3d 0%, #050d1c 55%, #02060e 100%);}
  canvas,svg{position:absolute;inset:0}
  .photo{position:absolute;left:96px;top:96px;width:888px;height:888px;border-radius:50%;overflow:hidden;
    box-shadow:0 0 60px rgba(52,211,153,.35)}
  /* square crop of the 3735x4969 headshot, face centered a little above the middle */
  .photo img{position:absolute;width:1100px;left:-84px;top:-78px}
</style></head><body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="photo"><img src="chris.jpg" alt="" /></div>
  <svg id="s" width="1080" height="1080" viewBox="0 0 1080 1080"></svg>
</div>
<script>
const W=1080,H=1080,dpr=2,C=540,R=444;
let seed=20261019;const rnd=()=>{seed=(seed+0x6d2b79f5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};

// stars in the sky band around the photo
const cv=document.getElementById("c");cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";
const g=cv.getContext("2d");g.scale(dpr,dpr);
const temps=["220,232,255","200,218,255","255,240,214","255,226,190","180,200,235"];
for(let i=0;i<900;i++){const x=rnd()*W,y=rnd()*H;if(Math.hypot(x-C,y-C)<R)continue;
  const a=.45+rnd()*.5,r=rnd()<.85?.9+rnd()*.7:1.6+rnd()*1.1,col=temps[Math.floor(rnd()*temps.length)];
  if(r>1.4){const gl=g.createRadialGradient(x,y,0,x,y,r*4);gl.addColorStop(0,`rgba(${col},${(a*.35).toFixed(2)})`);gl.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gl;g.beginPath();g.arc(x,y,r*4,0,Math.PI*2);g.fill()}
  g.fillStyle=`rgba(${col},${a.toFixed(2)})`;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}

// the ring: green into sky blue, with a soft glow, and the home-base star on it
const S=document.getElementById("s"),NS="http://www.w3.org/2000/svg";
const el=(n,a,p=S)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const defs=el("defs",{});
const lg=el("linearGradient",{id:"rg",x1:0,y1:1,x2:1,y2:0},defs);
el("stop",{offset:0,"stop-color":"#34d399"},lg);el("stop",{offset:.55,"stop-color":"#a7f3d0"},lg);el("stop",{offset:1,"stop-color":"#38bdf8"},lg);
const bl=el("filter",{id:"bl",x:"-20%",y:"-20%",width:"140%",height:"140%"},defs);el("feGaussianBlur",{stdDeviation:10},bl);
el("circle",{cx:C,cy:C,r:R+2,fill:"none",stroke:"url(#rg)","stroke-width":14,opacity:.6,filter:"url(#bl)"});
el("circle",{cx:C,cy:C,r:R+2,fill:"none",stroke:"url(#rg)","stroke-width":7});
const a=-Math.PI/4,hx=C+(R+2)*Math.cos(a),hy=C+(R+2)*Math.sin(a);
const hg=el("radialGradient",{id:"hg"},defs);el("stop",{offset:0,"stop-color":"#ecfdf5","stop-opacity":.95},hg);el("stop",{offset:.35,"stop-color":"#34d399","stop-opacity":.5},hg);el("stop",{offset:1,"stop-color":"#34d399","stop-opacity":0},hg);
el("circle",{cx:hx,cy:hy,r:46,fill:"url(#hg)"});el("circle",{cx:hx,cy:hy,r:8,fill:"#fff"});
el("path",{d:`M${hx} ${hy-34}V${hy+34}M${hx-34} ${hy}H${hx+34}`,stroke:"#ecfdf5","stroke-opacity":.8,"stroke-width":1.6,"stroke-linecap":"round"});
</script></body></html>
