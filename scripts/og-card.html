<!doctype html>
<!-- Open Graph share image (1200x630), matching the site's night-sky hero.
     Render: open this file in Chrome at 1200x630 (or headless --screenshot) and save as
     public/images/og-social-vN.jpg (render at 2x with --force-device-scale-factor=2, downsample to 1200x630 with Lanczos, JPEG q95 with 4:4:4 color), then point siteData.defaultImage at it. -->
<html><head><meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet" />
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:#02060e}
  #stage{position:relative;width:100%;height:100%;
    background:
      radial-gradient(ellipse 26% 36% at 74% 30%, rgba(52,211,153,.15), transparent 70%),
      radial-gradient(ellipse 22% 30% at 92% 92%, rgba(236,72,153,.12), transparent 70%),
      radial-gradient(ellipse 26% 34% at 4% 98%, rgba(139,92,246,.2), transparent 70%),
      radial-gradient(ellipse 22% 30% at 30% 4%, rgba(99,102,241,.1), transparent 70%),
      radial-gradient(ellipse 24% 36% at 98% 2%, rgba(56,189,248,.14), transparent 70%),
      linear-gradient(118deg, transparent 22%, rgba(150,175,215,.06) 36%, rgba(200,212,240,.13) 47%, rgba(235,220,240,.11) 52%, rgba(150,175,215,.06) 62%, transparent 74%),
      radial-gradient(ellipse at 50% 0%, #0c1f3d 0%, #050d1c 55%, #02060e 100%);}
  canvas,svg{position:absolute;inset:0}
  .text{position:absolute;left:64px;top:50%;transform:translateY(-50%);width:600px}
  .name{font-size:27px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#34d399;margin-bottom:20px}
  .head{margin:0;font-weight:800;font-size:104px;line-height:.96;letter-spacing:-.035em;
    background:linear-gradient(180deg,#fff 0%,#eef3fb 55%,#b9c6da 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 22px rgba(120,170,255,.2))}
  .si{font-size:.6em}
  .why{margin:26px 0 14px;font-size:29px;line-height:1.3;font-weight:500;color:rgba(236,242,250,.92);letter-spacing:-.005em}
  .sig{text-wrap:balance;font-size:33px;font-weight:800;letter-spacing:-.01em;color:#34d399;text-shadow:0 0 18px rgba(52,211,153,.35)}
  .url{margin-top:22px;font-size:28px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#34d399;text-shadow:0 0 18px rgba(52,211,153,.35)}
</style></head><body>
<div id="stage">
  <canvas id="c"></canvas>
  <svg id="s" width="1200" height="630" viewBox="0 0 1200 630"></svg>
  <div class="text">
    <div class="name">Christopher A. Rotunno</div>
    <h1 class="head">The Elvis of<br><span class="si">Super Intelligence.</span></h1>
    <div class="why">Elvis carried a sound born in the American South to people who'd never heard it.</div>
    <div class="sig">I connect the working class to super intelligence.</div>
    <div class="url">rotunno.ai</div>
  </div>
</div>
</div>
<script>
// the crossover, same shapes as src/components/hero/CrossoverConstellation.astro (its viewBox units)
const CAPSULE="M100 14H100A26 26 0 0 1 126 40V72A26 26 0 0 1 100 98H100A26 26 0 0 1 74 72V40A26 26 0 0 1 100 14Z";
const STAND=["M100 98V180","M76 184a24 5 0 1 0 48 0a24 5 0 1 0 -48 0"], MIC_STARS=[[100,14],[100,98],[100,180],[76,184],[124,184]];
const LAYERS=[[[86,40],[86,56],[86,72]],[[100,32],[100,48],[100,64],[100,80]],[[113,44],[113,68]]], OUT=[126,56];
// the professionals the signal reaches: a head and shoulders with the mark of their trade
const person=(cx,cy,mark)=>({lines:[`M${cx-6} ${cy-8}a6 6 0 1 0 12 0a6 6 0 1 0 -12 0`,`M${cx-13} ${cy+14}Q${cx-13} ${cy+1} ${cx} ${cy+1}Q${cx+13} ${cy+1} ${cx+13} ${cy+14}`,...mark],stars:[[cx-13,cy+14],[cx+13,cy+14],[cx,cy-14]],glow:[cx,cy]});
const PEOPLE=[
  person(240,6,["M240 8L237.6 11L240 19L242.4 11Z"]),
  person(292,46,["M285 49H299V58H285Z","M282 60H302","M287 56L291 53L294 54L297 51"]),
  person(292,112,["M286 126V118H298V126","M286 118L289 114","M298 118L295 114"]),
  person(240,150,["M231 142.5A9 9 0 0 1 249 142.5","M229 142.5H251"]),
];
let seed=20261018;const rnd=()=>{seed=(seed+0x6d2b79f5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};
const sub=d=>d.split("M").filter(p=>p.trim()).map(p=>[...p.replace(/Z/g,"").matchAll(/(-?[\d.]+),(-?[\d.]+)/g)].map(m=>[+m[1],+m[2]]));
function rdp(p,e){if(p.length<3)return p;const a=p[0],b=p[p.length-1];let w=0,at=0;for(let i=1;i<p.length-1;i++){const[x,y]=p[i];const L=Math.hypot(b[0]-a[0],b[1]-a[1])||1;const d=Math.abs((b[1]-a[1])*x-(b[0]-a[0])*y+b[0]*a[1]-b[1]*a[0])/L;if(d>w){w=d;at=i}}if(w<=e)return[a,b];return[...rdp(p.slice(0,at+1),e).slice(0,-1),...rdp(p.slice(at),e)]}
const ring=(p,e)=>{const s=rdp(p,e);return s.length>2&&s[0][0]===s.at(-1)[0]&&s[0][1]===s.at(-1)[1]?s.slice(0,-1):s};
const hash=(x,y)=>{const v=Math.sin(x*12.9898+y*78.233)*43758.5453;return v-Math.floor(v)};
const TEMPS=["#e6f1ff","#e6f1ff","#e6f1ff","#d4e4ff","#c9dcff","#fff1d6","#ffe0b8"];
const W=1200,H=630,dpr=2;

// the crossover on the right half, beside the copy
const K=1.85, OX=606, OY=140;
const T=([x,y])=>[OX+x*K,OY+y*K];
const outline=[Array.from({length:32},(_,i)=>{const t=i/32*Math.PI*2;return T([100+26*Math.cos(t),56+42*Math.sin(t)])})];

// starfield, kept out of the microphone and quieter behind the copy
const cv=document.getElementById("c");cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";
const g=cv.getContext("2d");g.scale(dpr,dpr);
const mask=new Path2D();outline.forEach(r=>{r.forEach(([x,y],i)=>i?mask.lineTo(x,y):mask.moveTo(x,y));mask.closePath()});
const temps=["220,232,255","200,218,255","255,240,214","255,226,190","180,200,235"];
for(let i=0;i<1300;i++){const x=rnd()*W,y=rnd()*H;
  const band=Math.abs((x-W*.5)*Math.cos(.5)+(y-H/2)*Math.sin(.5)*1.6)/W; if(rnd()>.35+.65*Math.exp(-((band/.14)**2)))continue;
  if(g.isPointInPath(mask,x,y))continue;
  let a=.45+rnd()*.5; if(x<650&&y>90&&y<560)a*=.5;
  const r=rnd()<.85?1+rnd()*.6:1.7+rnd()*1.1, col=temps[Math.floor(rnd()*temps.length)];
  if(r>1.4){const gl=g.createRadialGradient(x,y,0,x,y,r*4);gl.addColorStop(0,`rgba(${col},${(a*.35).toFixed(2)})`);gl.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gl;g.beginPath();g.arc(x,y,r*4,0,Math.PI*2);g.fill()}
  g.fillStyle=`rgba(${col},${a.toFixed(2)})`;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}

// a distant spiral galaxy, low in the open sky between the copy and the microphone
(function(cx,cy,R){g.save();g.translate(cx,cy);g.scale(1,.42);g.rotate(.5);g.globalCompositeOperation="lighter";
  const glow=(x,y,r,c,a)=>{const gl=g.createRadialGradient(x,y,0,x,y,r);gl.addColorStop(0,`rgba(${c},${a})`);gl.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gl;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()};
  glow(0,0,R,"170,200,255",.1);
  for(let n=0;n<1600;n++){const arm=n%2,t=Math.pow(rnd(),.8)*3.4*Math.PI,r=Math.min(R*.95,R*.07*Math.exp(.24*t)),th=t+arm*Math.PI;
    const sc=r*.2,gs=()=>(rnd()+rnd()+rnd()-1.5)/1.5;const x=r*Math.cos(th)+gs()*sc,y=r*Math.sin(th)+gs()*sc,f=1-r/R;
    if(rnd()<.04)glow(x,y,2.5,"255,120,190",.35*f);else{g.fillStyle=`rgba(180,205,255,${((.25+rnd()*.55)*f).toFixed(2)})`;g.beginPath();g.arc(x,y,.4+rnd()*.7,0,Math.PI*2);g.fill()}}
  glow(0,0,R*.4,"255,236,205",.55);glow(0,0,R*.14,"255,250,240",.9);g.restore()})(560,572,62);

// a few bright foreground stars with flares, out in the open sky
[[40,40],[660,40],[1170,300],[560,300],[1160,600],[30,600],[380,40]].forEach(([x,y],i)=>{
  const s=3+(i%3)*1.6;const gl=g.createRadialGradient(x,y,0,x,y,s*3.2);gl.addColorStop(0,"rgba(220,232,255,.55)");gl.addColorStop(1,"rgba(220,232,255,0)");
  g.fillStyle=gl;g.beginPath();g.arc(x,y,s*3.2,0,Math.PI*2);g.fill();
  g.strokeStyle="rgba(230,240,255,.55)";g.lineWidth=.6;g.beginPath();g.moveTo(x-s*2,y);g.lineTo(x+s*2,y);g.moveTo(x,y-s*2);g.lineTo(x,y+s*2);g.stroke();
  g.fillStyle="#f4f8ff";g.beginPath();g.arc(x,y,1.3+(i%3)*.35,0,Math.PI*2);g.fill()});

// shooting stars, frozen mid-streak
function meteor(x,y,ang,len){const dx=Math.cos(ang),dy=Math.sin(ang),tx=x-dx*len,ty=y-dy*len;
  const lg=g.createLinearGradient(x,y,tx,ty);lg.addColorStop(0,"rgba(236,253,245,.95)");lg.addColorStop(.25,"rgba(167,243,208,.45)");lg.addColorStop(1,"rgba(236,253,245,0)");
  g.save();g.strokeStyle=lg;g.lineCap="round";g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(tx,ty);g.stroke();
  const hg=g.createRadialGradient(x,y,0,x,y,9);hg.addColorStop(0,"rgba(236,253,245,.9)");hg.addColorStop(1,"rgba(236,253,245,0)");
  g.fillStyle=hg;g.beginPath();g.arc(x,y,9,0,Math.PI*2);g.fill();g.fillStyle="#fff";g.beginPath();g.arc(x,y,1.8,0,Math.PI*2);g.fill();g.restore()}
meteor(470,70,Math.PI*.84,180);
meteor(1150,560,Math.PI*.8,120);

// svg constellations
const S=document.getElementById("s"),NS="http://www.w3.org/2000/svg";
const el=(n,a,p=S)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const defs=el("defs",{});
const grads={};const grad=c=>{if(grads[c])return grads[c];const id="g"+c.slice(1);const rg=el("radialGradient",{id},defs);
  [[0,.9],[.3,.32],[1,0]].forEach(([o,op])=>el("stop",{offset:o,"stop-color":c,"stop-opacity":op},rg));return grads[c]=`url(#${id})`};
function star(x,y,h,green=false,scale=1){
  const color=green?(h>.7?"#ecfdf5":"#a7f3d0"):TEMPS[Math.min(6,Math.floor(((h*13.37)%1)*7))];
  const glow=green?"#34d399":color;
  el("circle",{cx:x,cy:y,r:(5.5+h*4.5)*scale,fill:grad(glow),opacity:.3});
  el("circle",{cx:x,cy:y,r:(2.2+h*2.2)*scale,fill:grad(glow),opacity:.85});
  if(h>.72){const s=(4.5+h*4)*scale;el("path",{d:`M${x-s} ${y}H${x+s}M${x} ${y-s}V${y+s}`,stroke:color,"stroke-width":.45,"stroke-opacity":.55,"stroke-linecap":"round"})}
  el("circle",{cx:x,cy:y,r:((green?1.05:.75)+h*.9)*scale,fill:color});
}
const poly=p=>p.map(q=>q.map(v=>v.toFixed(1)).join(",")).join(" ");
// everything drawn in the component's own units, scaled into place
const G=el("g",{transform:`translate(${OX} ${OY}) scale(${K})`});
const line=(d,p=G)=>{el("path",{d,fill:"none",stroke:"#7dd3fc","stroke-opacity":.14,"stroke-width":4.5,"stroke-linecap":"round","stroke-linejoin":"round"},p);
  el("path",{d,fill:"none",stroke:"#c7d6ea","stroke-opacity":.85,"stroke-width":1.5,"stroke-linecap":"round","stroke-linejoin":"round"},p)};
const lstar=(x,y,green=false,sc=.75)=>{const h=hash(x,y),color=green?(h>.7?"#ecfdf5":"#a7f3d0"):TEMPS[Math.min(6,Math.floor(((h*13.37)%1)*7))],glow=green?"#34d399":color;
  el("circle",{cx:x,cy:y,r:(5.5+h*4.5)*sc,fill:grad(glow),opacity:.3},G);el("circle",{cx:x,cy:y,r:(2.2+h*2.2)*sc,fill:grad(glow),opacity:.85},G);
  el("circle",{cx:x,cy:y,r:((green?1.05:.75)+h*.9)*sc*1.3,fill:color},G)};
const hg=el("radialGradient",{id:"hg"},defs);el("stop",{offset:0,"stop-color":"#34d399","stop-opacity":.75},hg);el("stop",{offset:1,"stop-color":"#34d399","stop-opacity":0},hg);
// the microphone, its SI grille and the brightest star where the signal leaves
[CAPSULE,...STAND].forEach(d=>line(d));
const links=[...LAYERS.slice(0,-1).flatMap((l,i)=>l.flatMap(a=>LAYERS[i+1].map(b=>[a,b]))),...LAYERS.at(-1).map(b=>[b,OUT])];
links.forEach(([a,b])=>el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:"#34d399","stroke-opacity":.65,"stroke-width":.8},G));
// the broadcast
[18,34,50].forEach(r=>{const a=46*Math.PI/180,[mx,my]=OUT;
  el("path",{d:`M${mx+r*Math.cos(-a)} ${my+r*Math.sin(-a)}A${r} ${r} 0 0 1 ${mx+r*Math.cos(a)} ${my+r*Math.sin(a)}`,fill:"none",stroke:"#a7f3d0","stroke-opacity":.85,"stroke-width":1.9,"stroke-linecap":"round","stroke-dasharray":"0 5"},G)});
// the people it reaches, lit green
PEOPLE.forEach(p=>{el("circle",{cx:p.glow[0],cy:p.glow[1],r:26,fill:"url(#hg)",opacity:.75},G);p.lines.forEach(d=>line(d))});
[...MIC_STARS,...PEOPLE.flatMap(p=>p.stars)].forEach(([x,y])=>lstar(x,y));
LAYERS.flat().forEach(([x,y])=>lstar(x,y,true));
el("circle",{cx:OUT[0],cy:OUT[1],r:14,fill:"url(#hg)"},G);el("circle",{cx:OUT[0],cy:OUT[1],r:2.8,fill:"#ecfdf5"},G);
el("path",{d:`M${OUT[0]} ${OUT[1]-8}V${OUT[1]+8}M${OUT[0]-8} ${OUT[1]}H${OUT[0]+8}`,stroke:"#ecfdf5","stroke-opacity":.7,"stroke-width":.5},G);
</script></body></html>
