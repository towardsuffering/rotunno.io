<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  body { width: var(--w); height: var(--h); overflow: hidden; font-family: Inter, system-ui, sans-serif; background: #071223; }
  #stage { position: relative; width: 100%; height: 100%;
    background: radial-gradient(ellipse at 30% 0%, #13305a 0%, #0a1a33 50%, #050b16 100%); }
  canvas { position: absolute; inset: 0; }
  .text { position: absolute; color: #e6f1ff; }
  .tag { font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: #34d399; font-weight: 700; margin-bottom: 18px; }
  .name { font-weight: 800; letter-spacing: -0.02em; line-height: 1.02; }
  .role { color: #38bdf8; font-weight: 600; }
  .line { color: #b6c6db; font-weight: 500; }
  .line b { color: #34d399; font-weight: 700; }
  .url { color: #6f86a6; letter-spacing: .25em; font-weight: 600; text-transform: uppercase; }
  .note { position: absolute; color: #4f6482; font-size: 11px; font-style: italic; }

  /* Open Graph 1200x630: text left, data story right */
  .og .text { left: 72px; top: 50%; transform: translateY(-50%); width: 600px; }
  .og .name { font-size: 64px; margin-bottom: 16px; }
  .og .role { font-size: 27px; margin-bottom: 30px; }
  .og .line { font-size: 26px; line-height: 1.4; margin-bottom: 40px; }
  .og .url { font-size: 16px; }

  /* LinkedIn cover 1584x396: profile photo covers the bottom-left, so text sits right */
  .li .text { right: 80px; top: 50%; transform: translateY(-50%); text-align: right; width: 640px; }
  .li .tag { font-size: 14px; margin-bottom: 14px; }
  .li .name { font-size: 46px; margin-bottom: 12px; }
  .li .role { font-size: 22px; margin-bottom: 14px; }
  .li .line { font-size: 21px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="text" id="text"></div>
</div>
<script>
const mode = new URLSearchParams(location.search).get("mode") || "og";
const W = mode === "og" ? 1200 : 1584, H = mode === "og" ? 630 : 396;
document.body.style.setProperty("--w", W + "px");
document.body.style.setProperty("--h", H + "px");
document.getElementById("stage").className = mode;

document.getElementById("text").innerHTML = mode === "og"
  ? `<div class="name">Christopher A.<br>Rotunno</div>
     <div class="role">Data Analytics Engineer &amp; BI Leader</div>
     <div class="line">Ten years. Four industries.<br>Millions of scattered data points.<br><b>I connect them.</b></div>
     <div class="url">rotunno.ai</div>`
  : `<div class="tag">Fragmented &nbsp;→&nbsp; Connected &nbsp;→&nbsp; Trusted</div>
     <div class="name">I connect the data.</div>
     <div class="role">Data Analytics Engineer &amp; BI Leader</div>
     <div class="line">Ten years across four industries &nbsp;·&nbsp; <b>rotunno.ai</b></div>`;

// seeded so every render is identical
let seed = mode === "og" ? 7 : 11;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const cv = document.getElementById("c");
const dpr = 2;
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px";
const ctx = cv.getContext("2d");
ctx.scale(dpr, dpr);
const dot = (x, y, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };

// the story runs left to right: scattered → networked → structured bars
// og: story occupies the right half; li: the whole width up to the text
const zone = mode === "og"
  ? { x0: 640, x1: 1160, y0: 70, y1: 570 }
  : { x0: 0, x1: 900, y0: 30, y1: 366 };
const zw = zone.x1 - zone.x0, zh = zone.y1 - zone.y0;

// 1. fragmented: faint grey scatter across the background, densest on the left of the zone
const scatterN = mode === "og" ? 520 : 700;
for (let i = 0; i < scatterN; i++) {
  const x = mode === "og" ? rnd() * W : rnd() * (zone.x0 + zw * 0.55);
  const y = rnd() * H;
  const fade = mode === "og" ? (x < 640 ? 0.4 : 1) : 0.8;
  dot(x, y, 0.8 + rnd() * 1.3, `rgba(138,160,187,${(0.25 + rnd() * 0.45) * fade})`);
}

// 3. structured: dot-matrix bars rising on the right of the zone
const bars = mode === "og" ? 7 : 8;
const bx0 = zone.x0 + zw * (mode === "og" ? 0.3 : 0.58), bx1 = zone.x1;
const gap = (bx1 - bx0) / bars, bw = gap * 0.7, sp = 7;
const base = zone.y1;
const tops = [];
for (let b = 0; b < bars; b++) {
  const h = (0.22 + 0.78 * Math.pow((b + 1) / bars, 1.4) - (b % 3 === 1 ? 0.05 : 0)) * zh * 0.92;
  const cols = Math.max(2, Math.floor(bw / sp));
  const x0 = bx0 + gap * b + (gap - (cols - 1) * sp) / 2;
  const rows = Math.floor(h / sp);
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++) {
      const t = r / rows;
      dot(x0 + c * sp, base - r * sp, 1.5, `rgba(${56 + t * 69},${189 + t * 22},${248 - t * 95},${0.55 + t * 0.4})`);
    }
  tops.push({ x: x0 + ((cols - 1) * sp) / 2, y: base - (rows - 1) * sp });
}

// 2. connected: a network of nodes between the scatter and the bars, wiring into the bar tops
const nodes = [];
const nx0 = zone.x0 + zw * (mode === "og" ? 0.02 : 0.28), nx1 = bx0 + gap * 1.5;
const nodeN = mode === "og" ? 26 : 40;
for (let i = 0; i < nodeN; i++) {
  const x = nx0 + rnd() * (nx1 - nx0);
  // nodes rise toward the right, following the bars' trend
  const trend = zone.y1 - ((x - nx0) / (nx1 - nx0)) * zh * 0.45 - zh * 0.2;
  const y = Math.min(zone.y1 - 10, Math.max(zone.y0 + 10, trend + (rnd() - 0.5) * zh * 0.55));
  nodes.push({ x, y });
}
nodes.push(...tops);
const link = mode === "og" ? 120 : 95;
ctx.lineWidth = 1.1;
const edge = (a, b, d) => {
  ctx.strokeStyle = `rgba(52,211,153,${Math.max(0.18, 0.7 * (1 - d / (link * 1.8)))})`;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
};
const byX = nodes.map((n, i) => i).sort((a, b) => nodes[a].x - nodes[b].x);
byX.forEach((i, k) => {
  const n = nodes[i];
  const dists = byX.slice(0, k).map((j) => [Math.hypot(nodes[j].x - n.x, nodes[j].y - n.y), j]).sort((p, q) => p[0] - q[0]);
  if (dists.length) edge(n, nodes[dists[0][1]], dists[0][0]);
  for (const [d, j] of dists.slice(1, 3)) if (d < link) edge(n, nodes[j], d);
});
nodes.forEach((n, i) => {
  const top = i >= nodeN;
  dot(n.x, n.y, top ? 4 : 3.2, "rgba(52,211,153,0.18)");
  dot(n.x, n.y, top ? 2.6 : 2.1, top ? "#a7f3d0" : "#34d399");
});

// legibility: darken behind the text block
const g = mode === "og"
  ? ctx.createLinearGradient(0, 0, 700, 0)
  : ctx.createLinearGradient(W, 0, W - 760, 0);
g.addColorStop(0, "rgba(5,11,22,0.75)");
g.addColorStop(0.75, "rgba(5,11,22,0.35)");
g.addColorStop(1, "rgba(5,11,22,0)");
ctx.fillStyle = g;
ctx.fillRect(0, 0, W, H);
</script>
</body>
</html>
